<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t d">
  <title id="t">Cold Storage</title>
  <desc id="d">An isometric shipping container.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16304f"/><stop offset="1" stop-color="#0a1523"/>
    </linearGradient>
    <linearGradient id="lid" x1="151" y1="133" x2="627" y2="549" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf6ff"/><stop offset="1" stop-color="#a9dcfb"/>
    </linearGradient>
    <linearGradient id="side" x1="151" y1="275" x2="627" y2="891" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56c2f5"/><stop offset="1" stop-color="#2d95dd"/>
    </linearGradient>
    <linearGradient id="endf" x1="627" y1="549" x2="873" y2="749" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f7cc6"/><stop offset="1" stop-color="#115692"/>
    </linearGradient>
    <!-- Ribs are drawn full-height then clipped, so round caps never poke past
         the panel edges. -->
    <clipPath id="sideclip"><polygon points="151.4,274.7 627.4,549.5 627.4,890.9 151.4,616.1"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <polygon points="151.4,274.7 627.4,549.5 627.4,890.9 151.4,616.1" fill="url(#side)"/>
  <g clip-path="url(#sideclip)" stroke="#1c7cc2" stroke-width="10" stroke-linecap="round" opacity=".5"><line x1="219.4" y1="313.9" x2="219.4" y2="655.3"/><line x1="287.4" y1="353.2" x2="287.4" y2="694.6"/><line x1="355.4" y1="392.4" x2="355.4" y2="733.9"/><line x1="423.4" y1="431.7" x2="423.4" y2="773.1"/><line x1="491.4" y1="471.0" x2="491.4" y2="812.4"/><line x1="559.4" y1="510.2" x2="559.4" y2="851.6"/></g>
  <polygon points="627.4,549.5 872.6,407.9 872.6,749.3 627.4,890.9" fill="url(#endf)"/>
  <line x1="750.0" y1="478.7" x2="750.0" y2="820.1"
        stroke="#0e4c83" stroke-width="12" stroke-linecap="butt"/>
  <polygon points="396.6,133.1 872.6,407.9 627.4,549.5 151.4,274.7" fill="url(#lid)"/>
</svg>
